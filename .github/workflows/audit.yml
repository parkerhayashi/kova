name: npm audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Audit production dependencies only. The remaining high advisories are
      # all in dev-only lint tooling (braces → micromatch → fast-glob →
      # eslint-config-next) with no upstream fix yet; they never ship to the
      # browser. Drop --omit=dev once a patched braces is available.
      - run: npm audit --audit-level=high --omit=dev
