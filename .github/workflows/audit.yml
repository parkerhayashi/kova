name: npm audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # v7 of both actions run natively on Node 24 (Node 20 runners are
      # deprecated), so no FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 workaround.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Audit production dependencies only. The remaining high advisories are
      # all in dev-only lint tooling (braces → micromatch → fast-glob →
      # eslint-config-next) with no upstream fix yet; they never ship to the
      # browser. Drop --omit=dev once a patched braces is available.
      - run: npm audit --audit-level=high --omit=dev
